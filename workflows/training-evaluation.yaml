id: training-evaluation
name: Training Proposal Evaluation
description: Convert one approved public-source training proposal into a bounded local holdout, execute it without changing production behavior, and produce reviewable evidence.
lead: eval-curator
execution:
  kind: source-change
default_autonomy: 2
triggers:
  manual: true
  events: []
stages:
  - id: execute-holdout
    agent: test-engineer
    goal: Execute exactly the engine-issued `npm run agentflow -- training-holdout` command and persisted design path in the workflow task. Do not discover, redesign, or substitute the holdout. Record the report path, exact observation coverage, verdict, failures, calls, and token usage. Missing or incomplete measurements are NEEDS_EVIDENCE and may not be accepted as evaluated. Do not modify production behavior.
    context:
      load:
        - commands
      max_tokens: 1500
    output: training_holdout_results
  - id: review-evidence
    agent: model-improvement-diagnostician
    goal: Review only the persisted measured holdout report against its baseline and success criteria. Return PASS, FAIL, or NEEDS_EVIDENCE with cited coverage, measured benefit, risks, cost impact, rollback recommendation, and the next evidence needed. Missing or partial measurements are NEEDS_EVIDENCE and cannot be accepted. Do not promote or apply the proposal.
    context:
      load:
        - training_holdout_results
        - evaluation_results
      max_tokens: 1500
    output: training_evaluation_verdict
