services:
  postgres:
    image: "${AGENTFLOW_POSTGRES_IMAGE:-pgvector/pgvector:pg16}"
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports:
      - "${AGENTFLOW_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: "${AGENTFLOW_REDIS_IMAGE:-redis:7-alpine}"
    ports:
      - "${AGENTFLOW_REDIS_PORT:-16379}:6379"

  minio:
    image: "${AGENTFLOW_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentflow
      MINIO_ROOT_PASSWORD: agentflow-secret
    ports:
      - "${AGENTFLOW_MINIO_PORT:-19000}:9000"
      - "${AGENTFLOW_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
