project:
  name: Example Project
  summary: Replace this with a short description of the project and its users.
  default_workflows:
    - build-feature
    - review-pr
    - debug-failure
    - maintain-context
  autonomy: wide-open
context:
  include:
    - AGENTS.md
    - .agent-workflow/**
    - README.md
    - docs/**
    - src/**
    - package.json
  exclude:
    - node_modules/**
    - .git/**
    - dist/**
    - build/**
    - coverage/**
    - .agent-workflow/schedule-state.json
  max_project_tokens: 12000
storage:
  cache_summaries: true
  semantic_index: true
execution:
  policy_profile: local
  policy_profiles: {}
  worker_pool:
    worker_id: local-dev
    limit: 6
    concurrency: 1
    lease_seconds: 900
    interval_ms: 2000
    project_scoped: true
    default_profile: local
    profiles:
      local:
        description: Default single-lane local developer worker pool.
        lanes:
          - id: default
      split-review:
        description: Separate implementation and review lanes for local development.
        lanes:
          - id: implementation
            worker_id: implementation-lane
            limit: 6
            concurrency: 2
          - id: review
            worker_id: review-lane
            limit: 3
            concurrency: 1
policies:
  allow_wide_open: true
  require_approval_for_external_actions: false
  require_receipts: true
actions:
  allowed_commands:
    - npm install
    - npm test
    - npm run typecheck
    - npm run lint
    - npm run build
  blocked_commands:
    - rm *
    - git reset *
    - git clean *
    - sudo *
  command_timeout_ms: 120000
  max_output_chars: 20000
  allowed_write_paths:
    - .agent-workflow/**
    - docs/**
    - src/**
    - test/**
    - tests/**
    - package.json
    - README.md
    - AGENTS.md
  blocked_write_paths:
    - .git/**
    - node_modules/**
    - .env
    - .env.*
    - .agent-workflow/schedule-state.json
  max_write_bytes: 200000
  approval_rules: []
