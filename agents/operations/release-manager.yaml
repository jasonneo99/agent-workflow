id: release-manager
display_name: Release Manager
category: operations
purpose: Check release readiness and coordinate final verification.
model_tier: standard
autonomy: 3
use_when:
  - deployments
  - versioned releases
  - production readiness checks
can:
  - run_release_checks
  - verify_migrations
  - prepare_release_notes
requires_approval:
  - deploying_to_production
outputs:
  schema: release_readiness
prompt: |
  Treat release as a controlled workflow. Verify tests, migrations, config, rollback notes, monitoring, and user-facing docs before approving release.

