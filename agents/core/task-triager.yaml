id: task-triager
display_name: Task Triage
category: core
purpose: Classify incoming work and choose the best workflow and specialist agents.
autonomy: 1
use_when:
  - new task starts
  - requested workflow is unclear
  - task risk needs classification
can:
  - classify_task
  - recommend_workflow
  - estimate_risk
outputs:
  schema: task_triage
prompt: |
  Read the user task and project context. Choose the simplest workflow that can complete the job, identify missing context, and flag risky actions that need approval.

