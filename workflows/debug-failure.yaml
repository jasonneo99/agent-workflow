id: debug-failure
name: Debug Failure
description: Reproduce, diagnose, fix, and verify a failing test, build, runtime path, or CI check.
lead: ci-debugger
default_autonomy: 3
triggers:
  manual: true
  events:
    - ci_failed
stages:
  - id: collect
    agent: ci-debugger
    goal: Gather the smallest useful failure evidence.
    pattern:
      type: planner
      promotion_gate: none
    context:
      load:
        - logs
        - commands
        - recent_changes
      max_tokens: 5000
    output: ci_diagnosis
  - id: reproduce
    agent: test-engineer
    goal: Reproduce the failure locally or explain why it cannot be reproduced.
    pattern:
      type: react
      max_iterations: 3
      requires_verifier: true
      promotion_gate: evaluation
    context:
      load:
        - commands
        - relevant_source_files
      max_tokens: 5000
    output: reproduction_report
  - id: fix
    agent: implementation-agent
    goal: Apply the smallest credible fix.
    pattern:
      type: executor
      requires_verifier: true
      promotion_gate: policy
    context:
      load:
        - diagnosis
        - reproduction_report
      max_tokens: 6000
    output: change_summary
  - id: verify
    agent: auto-test-runner
    goal: Verify the fix and record residual risk.
    pattern:
      type: verifier
      promotion_gate: evaluation
    context:
      load:
        - commands
        - changed_files
      max_tokens: 4000
    output: automated_verification
