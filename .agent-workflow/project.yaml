project:
  name: agent-workflow
  summary: Portable Agent Workflows is a local-first, model-portable developer
    workflow kit. It provides reusable agent cards, orchestrated workflows, MCP
    tooling, dashboard controls, enterprise local storage, and project-local
    context so Codex, Cursor, VS Code, Claude Code, and other tools can reuse
    the same development agents without copying large prompts into each repo.
  roadmap_path: docs/roadmap.md
  default_workflows:
    - build-feature
    - review-pr
    - debug-failure
    - investigate-issue
    - maintain-context
  autonomy: 3
context:
  include:
    - AGENTS.md
    - .agent-workflow/*.md
    - .agent-workflow/*.yaml
    - README.md
    - docs/**
    - agents/**
    - workflows/**
    - apps/**
    - packages/**
    - templates/**
    - scripts/**
    - infra/**
    - package.json
    - package-lock.json
    - tsconfig.json
    - agent-workflow.bundle.json
  exclude:
    - node_modules/**
    - .git/**
    - dist/**
    - build/**
    - coverage/**
    - .next/**
    - .turbo/**
    - .cache/**
    - .agent-workflow/exports/**
    - .agent-workflow/schedule-state.json
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.png"
    - "**/*.webp"
    - "**/*.gif"
    - "**/*.woff"
    - "**/*.woff2"
    - "**/*.ttf"
  max_project_tokens: 12000
storage:
  cache_summaries: true
  semantic_index: true
execution:
  policy_profile: local
  policy_profiles: {}
  executor_adapters: {}
policies:
  allow_wide_open: false
  require_approval_for_external_actions: true
  require_receipts: true
actions:
  allowed_commands:
    - npm run typecheck
    - npm run validate
    - npm run validate-examples
    - npm run provider-check
    - npm run check
    - npm run reliability -- intent *
    - npm run list
    - npm run status
    - npm run agentflow -- list
    - npm run agentflow -- status
    - npm run agentflow -- training-holdout *
    - npm run index-project -- --project . --max-files 100
    - "npm exec -- node --import tsx --input-type=module -e 'import {
      unfulfilledCompletionReason, verificationCompletionReason } from
      \"./packages/model-providers/src/quality.ts\"; const input = { workflowId:
      \"debug-failure\", workflowTask: \"Implement structured requester
      lifecycle messaging\", stageId: \"implement\", agentId:
      \"implementation-agent\", stagePattern: { type: \"executor\" } }; const
      output = { outcome: \"completed\", summary: \"Implementation remains
      pending confirmation and requires fresh reads.\", artifact: {},
      requestedFileWrites: [{ path: \"packages/example.ts\", content: \"export
      const example = true;\" }], requestedFileReads: [\"packages/example.ts\"]
      }; console.log(JSON.stringify({ case: \"pending implementation with
      product write\", expected: \"non-null completion violation\", actual:
      unfulfilledCompletionReason(input, output) })); const verifier = {
      ...input, stageId: \"verify\", agentId: \"auto-test-runner\",
      stagePattern: { type: \"verifier\" } }; for (const commandLine of [\"npm
      run typecheck\", \"npm run validate-boundary\", \"node --import tsx --test
      packages/storage/src/run-notification-rendering.test.ts\", \"npm test\"])
      { console.log(JSON.stringify({ case: commandLine, expected: null, actual:
      verificationCompletionReason(verifier, [{ commandLine, exitCode: 0,
      timedOut: false, artifactUri: \"artifact://synthetic/probe\" }]) })); }'"
    - "npm exec -- node --input-type=module -e 'import fs from \"node:fs\";
      const lines = fs.readFileSync(\"apps/cli/src/index.ts\",
      \"utf8\").split(\"\\n\"); const terms = [\"workflow_repair_learning\",
      \"workflowRepairLesson(\", \"workflowDeliveryRepairReason(\", \"async
      function queueWorkflow(\"]; const selected = new Set(); for (let i = 0; i
      < lines.length; i++) { if (terms.some(term => lines[i].includes(term))) {
      for (let j = Math.max(0, i - 90); j < Math.min(lines.length, i + 180);
      j++) selected.add(j); } } console.log([...selected].sort((a,b) =>
      a-b).map(i => `${i+1}: ${lines[i]}`).join(\"\\n\"));'"
  blocked_commands:
    - rm *
    - git reset *
    - git clean *
    - sudo *
    - curl *
    - wget *
    - ssh *
    - scp *
  command_timeout_ms: 120000
  max_output_chars: 20000
  allowed_write_paths:
    - .agent-workflow/**
    - AGENTS.md
    - README.md
    - docs/**
    - agents/**
    - workflows/**
    - apps/**
    - packages/**
    - templates/**
    - scripts/**
    - infra/**
    - package.json
    - package-lock.json
    - tsconfig.json
    - agent-workflow.bundle.json
    - repository-maintenance-baseline.json
  blocked_write_paths:
    - .git/**
    - node_modules/**
    - .env
    - .env.*
    - .agent-workflow/schedule-state.json
    - "**/.next/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/coverage/**"
  max_write_bytes: 250000
  auto_approve_max_risk: medium
