name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate definitions
        run: npm run validate

      - name: Template test
        run: npm test --prefix templates/project

      - name: Template typecheck
        run: npm run typecheck --prefix templates/project

      - name: Template lint
        run: npm run lint --prefix templates/project

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start enterprise services
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Run enterprise smoke test
        run: npm run smoke
