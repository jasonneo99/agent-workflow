services:
  postgres:
    image: "${AGENTFLOW_POSTGRES_IMAGE:-pgvector/pgvector:pg16}"
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow
      POSTGRES_DB: agentflow
    ports:
      - "${AGENTFLOW_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: "${AGENTFLOW_REDIS_IMAGE:-redis:7-alpine}"
    ports:
      - "${AGENTFLOW_REDIS_PORT:-16379}:6379"

  minio:
    # Keep the legacy service name so existing compose commands still work.
    # LocalStack supplies the S3-compatible API now that the previously pinned
    # public MinIO image is no longer pullable. Use a new volume so legacy MinIO
    # data is left untouched rather than interpreted as LocalStack state.
    image: "${AGENTFLOW_OBJECT_STORAGE_IMAGE:-localstack/localstack:4.9.1}"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: agentflow
      AWS_SECRET_ACCESS_KEY: agentflow-secret
      PERSISTENCE: "1"
    ports:
      - "${AGENTFLOW_MINIO_PORT:-19000}:4566"
    volumes:
      - object-storage-data:/var/lib/localstack

volumes:
  postgres-data:
  object-storage-data:
