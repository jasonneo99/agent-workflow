name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start enterprise services
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Typecheck
        run: npm run typecheck

      - name: Validate definitions
        run: npm run validate

      - name: Validate open-source boundary
        run: npm run validate-boundary

      - name: Validate scrubbed examples
        run: npm run validate-examples

      - name: Test packages
        run: npm test
        env:
          AGENTFLOW_TEST_EVIDENCE_DIR: .agent-workflow/test-evidence

      - name: Upload PostgreSQL fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-fixture-evidence
          path: .agent-workflow/test-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Verify package contents
        run: npm run pack:check

      - name: Publish to npm
        run: npm publish --access public

      - name: Stop enterprise services
        if: always()
        run: docker compose -f infra/docker-compose.yml down
