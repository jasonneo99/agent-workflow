name: Agent Workflow plugin release

on:
  workflow_dispatch:
  push:
    tags:
      - "plugin-v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node plugins/agent-workflow/scripts/bundle-runtime.mjs
      - name: Verify bundled runtime without repository fallback
        run: node plugins/agent-workflow/scripts/verify-bundled-runtime.mjs
      - name: Package plugin
        run: |
          cd plugins
          zip -qr ../agent-workflow-plugin.zip agent-workflow -x 'agent-workflow/runtime/*'
          zip -qr ../agent-workflow-skills-only.zip agent-workflow-skills-only
          cd ..
          unzip -t agent-workflow-plugin.zip
          unzip -t agent-workflow-skills-only.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-workflow-plugin
          path: |
            agent-workflow-plugin.zip
            agent-workflow-skills-only.zip
      - name: Attach tagged release asset
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" agent-workflow-plugin.zip agent-workflow-skills-only.zip --generate-notes
