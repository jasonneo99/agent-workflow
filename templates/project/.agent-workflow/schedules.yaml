schedules:
  - id: weekly-context-maintenance
    enabled: false
    every_minutes: 10080
    workflow: maintain-context
    task: "Update durable project context, decisions, and command notes."
    index_max_files: 100
    worker_limit: 6
  - id: daily-test-triage
    enabled: false
    every_minutes: 1440
    agent: ci
    task: "Review recent test and CI failures and recommend next fixes."
    index_max_files: 100
    worker_limit: 1
