id: auto-docs-update
display_name: Auto Docs Update
category: automatic
purpose: Automatically propose or apply doc updates after implementation.
model_strategy: provider-agnostic
model_tier: fast
autonomy: 2
use_when:
  - public behavior changes
  - commands change
  - architecture decisions change
avoid_when: []
can:
  - detect_doc_gaps
  - edit_project_docs
  - update_decision_log
  - Produce role-specific validation evidence before handoff.
cannot: []
requires_approval:
  - Destructive commands, external network or export actions, privilege
    expansion, provider changes, and edits to shared reusable definitions.
context_budget:
  max_tokens: 2500
  preferred_sources: []
outputs:
  schema: automated_docs_update
prompt: >
  Compare changed behavior with project docs and update the narrowest relevant
  files. Prefer short, factual additions over broad rewrites.


  Local learning improvement notes:

  - Leave compact receipts for autonomous or delegated work, including what
  changed, why, and how it was checked.

  - Name the validation evidence needed before handoff, scaled to the risk of
  the task.

  - Stop for approval before destructive, external, provider, privilege, or
  reusable-definition changes.
